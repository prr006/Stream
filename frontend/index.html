<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream POC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  ul { list-style: none; padding: 0; max-height: 240px; overflow-y: auto; border: 1px solid #ccc; border-radius: 6px; }
  li { padding: .45rem .6rem; border-bottom: 1px solid #eee; }
  li:last-child { border-bottom: 0; }
  li a { text-decoration: none; color: #0b57d0; }
  li small { color: #777; margin-left: .5rem; }
  video { width: 100%; background: #000; border-radius: 6px; margin-top: .5rem; }
  button { margin-right: .4rem; padding: .3rem .7rem; }
  #banner { padding: .6rem .8rem; border-radius: 6px; background: #f1f3f4; }
  #banner.ok { background: #e6f4ea; }
  #status { font-size: .85rem; color: #555; }
  #now-playing { font-weight: 600; }
  input { padding: .35rem .5rem; margin-bottom: .5rem; }
  #detect { font-size: .9rem; border: 1px solid #ddd; border-radius: 6px; padding: .6rem .8rem; margin-top: .5rem; }
  #detect .warn { color: #b3261e; }
  #detect code { background: #f1f3f4; padding: 0 .3rem; border-radius: 3px; }
  #subs { margin-top: .5rem; }
  #subs label { display: block; padding: .2rem 0; }
  #subs .unsupported { color: #888; }
</style>
</head>
<body>

<h1>Google Drive &rarr; backend &rarr; browser (MKV + subtitles POC)</h1>

<div id="banner">checking authorization&hellip;</div>

<h2>1. Pick a video from your Drive</h2>
<input id="filter" placeholder="filter by name&hellip;" size="32">
<ul id="files"></ul>

<h2>2. Play / seek</h2>
<p id="now-playing"></p>
<video id="player" controls preload="metadata" crossorigin="anonymous"></video>
<p>
  Seek to:
  <button data-jump="0.25">25%</button>
  <button data-jump="0.50">50%</button>
  <button data-jump="0.90">90%</button>
  <span id="status"></span>
</p>

<div id="detect" hidden></div>
<div id="subs"></div>

<script>
const $ = (s) => document.querySelector(s);
const video = $("#player");
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

async function main() {
  const status = await (await fetch("/auth/status")).json();
  if (!status.authorized) {
    $("#banner").innerHTML =
      'Not authorized. <a href="/auth/login">Sign in with Google</a> to list and stream your videos.';
    return;
  }
  $("#banner").className = "ok";
  $("#banner").innerHTML = 'Authorized with Google Drive. (<a href="/auth/logout">log out</a>)';

  const res = await fetch("/files");
  if (res.status === 401) {
    $("#banner").innerHTML =
      'Session expired. <a href="/auth/login">Re-authorize with Google</a>.';
    return;
  }
  const data = await res.json();
  const all = data.files || [];
  render(all);
  $("#filter").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    render(all.filter(f => f.name.toLowerCase().includes(q)));
  });
}

function render(files) {
  $("#files").innerHTML = files.length
    ? files.map(f => {
        const size = f.size ? (f.size / 1048576).toFixed(1) + " MB" : "?";
        return `<li><a href="#" data-id="${f.id}">${escapeHtml(f.name)}</a>
                <small>${escapeHtml(f.mimeType)} &middot; ${size}</small></li>`;
      }).join("")
    : "<li><small>No video files found in this Drive account.</small></li>";

  document.querySelectorAll("#files a").forEach(a =>
    a.addEventListener("click", (e) => {
      e.preventDefault();
      play(a.dataset.id, a.textContent);
    }));
}

function play(id, name) {
  clearSubs();
  $("#detect").hidden = true;
  $("#subs").innerHTML = "";
  video.src = `/stream/${id}`;
  $("#now-playing").textContent = name;
  video.play().catch(() => {}); // autoplay may be blocked; user can press play
  probe(id);                    // async: show container/codec/subtitle info
}

/* ---------------- probing / detection ---------------- */

async function probe(id) {
  const box = $("#detect");
  box.hidden = false;
  box.innerHTML = "Probing container/codec/subtitle streams via <code>/probe</code>&hellip;";
  let info;
  try {
    const res = await fetch(`/probe/${id}`);
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    info = await res.json();
  } catch (e) {
    box.innerHTML = `<span class="warn">Probe failed: ${escapeHtml(e.message)}</span>`;
    return;
  }
  renderDetection(info);
  renderSubtitles(info);
}

function renderDetection(info) {
  const p = info.playability;
  const lines = [];
  const dur = info.duration ? (info.duration / 60).toFixed(0) + " min" : "?";
  lines.push(`<b>Container:</b> <code>${escapeHtml(p.container || "?")}</code> &middot; duration ${dur} (via ${info.probe_engine})`);
  if (info.video) lines.push(`<b>Video:</b> <code>${escapeHtml(info.video.codec)}</code> ${info.video.width || "?"}x${info.video.height || "?"}`);
  lines.push(`<b>Audio:</b> ${info.audio.map(a => `<code>${escapeHtml(a.codec)}</code> (${escapeHtml(a.language)})`).join(", ") || "none"}`);
  lines.push(escapeHtml(p.browser_note));

  // What does THIS browser think about MKV?
  const mkvSupport = info.format_name.includes("matroska")
    ? video.canPlayType('video/x-matroska')
    : "n/a";
  if (mkvSupport === "") lines.push(`<span class="warn">This browser reports no MKV support in &lt;video&gt;. Use Chrome/Edge.</span>`);
  else if (mkvSupport !== "n/a") lines.push(`This browser's MKV check: <code>${mkvSupport || "no"}</code>`);

  (p.warnings || []).forEach(w => lines.push(`<span class="warn">&#9888; ${escapeHtml(w)}</span>`));
  $("#detect").innerHTML = lines.map(l => `<div>${l}</div>`).join("");
}

/* ---------------- subtitles ---------------- */

let subtitleEntries = []; // {trackEl, label}

function clearSubs() {
  video.querySelectorAll("track").forEach(t => t.remove());
  subtitleEntries = [];
}

function renderSubtitles(info) {
  const box = $("#subs");
  const subs = info.subtitles || [];
  if (!subs.length) {
    box.innerHTML = "<h2>3. Subtitles</h2><em>No embedded subtitle tracks detected.</em>";
    return;
  }
  box.innerHTML = "<h2>3. Subtitles (embedded tracks &rarr; WebVTT)</h2>";
  let firstCompatible = true;

  subs.forEach((t) => {
    const label = t.title || t.language || `stream ${t.index}`;
    if (!t.web_compatible) {
      box.innerHTML += `<div class="unsupported">&#10007; ${escapeHtml(label)}
        <small>(${escapeHtml(t.codec)} — ${escapeHtml(t.note || "unsupported")})</small></div>`;
      return;
    }

    // <track> element: browser fetches our /subtitles/...vtt and renders cues
    const trackEl = document.createElement("track");
    trackEl.kind = "subtitles";
    trackEl.src = t.url;
    trackEl.srclang = t.language || "und";
    trackEl.label = label;
    video.appendChild(trackEl);
    const entry = { trackEl, label };
    subtitleEntries.push(entry);

    const row = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    if (firstCompatible) { cb.checked = true; firstCompatible = false; }
    row.appendChild(cb);
    row.appendChild(document.createTextNode(` ${label} (${t.codec}${t.language ? ", " + t.language : ""})`));
    const note = document.createElement("small");
    note.style.color = "#777";
    note.textContent = " (loads from server cache)";
    row.appendChild(note);
    box.appendChild(row);

    const apply = () => {
      entry.trackEl.track.mode = cb.checked ? "showing" : "disabled";
      note.textContent = cb.checked ? "" : " (off)";
    };
    cb.addEventListener("change", apply);
    trackEl.addEventListener("load", () => { note.textContent = cb.checked ? "" : " (off)"; });
    trackEl.addEventListener("error", () => {
      note.textContent = " (failed to load — extraction error; check backend log)";
      note.style.color = "#b3261e";
    });
    note.textContent = cb.checked ? " (extracting… first run reads the whole file server-side)" : " (off)";
    apply();
  });
}

document.querySelectorAll("[data-jump]").forEach(btn =>
  btn.addEventListener("click", () => {
    if (Number.isFinite(video.duration) && video.duration > 0) {
      video.currentTime = video.duration * parseFloat(btn.dataset.jump);
    }
  }));

// Event log proves buffering/seeking: "seeking" followed by new reads and the
// buffered range advancing.
for (const ev of ["loadedmetadata","seeking","seeked","waiting","canplay","progress","stalled","error"]) {
  video.addEventListener(ev, () => {
    const bufferedEnd = video.buffered.length
      ? video.buffered.end(video.buffered.length - 1).toFixed(1) : "0.0";
    $("#status").textContent =
      `event: ${ev} | now ${video.currentTime.toFixed(1)}s | buffered to ${bufferedEnd}s`;
    if (ev === "error" && video.error) {
      $("#status").textContent += ` (media error code ${video.error.code}: ${video.error.message || "unknown"})`;
    }
  });
}

main();
</script>
</body>
</html>
